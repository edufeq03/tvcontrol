<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IgnoControl - Acesso Seguro</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 0.88rem;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px; /* Evita auto-zoom do Safari no iOS */
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.82rem;
            margin-bottom: 18px;
        }
        .hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/icon.png" alt="IgnoControl" class="logo">
        <h1>IgnoControl</h1>
        <p>Informe o token de segurança para acessar o controle remoto.</p>

        {% if erro %}
        <div class="error-msg">{{ erro }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="input-group">
                <label for="token">Token de Acesso</label>
                <input type="password" id="token" name="token" placeholder="Digite o token..." required autofocus>
            </div>
            <button type="submit" class="btn-submit">Desbloquear</button>
        </form>

        <div class="hint">
            O token é exibido no terminal ao iniciar o servidor ou pode ser configurado em ~/.config/ignocontrol/config.json.
        </div>
    </div>
</body>
</html>
